[project]
name = "mlf-c2o-final"
version = "1.0.0"
description = "Capacity-aware close-to-open equity strategy pipeline"
requires-python = "==3.13.5"
dependencies = [
    "lightgbm==4.6.0",
    "matplotlib==3.10.0",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "pyarrow==24.0.0",
    "quantstats==0.0.81",
    "scikit-learn==1.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
